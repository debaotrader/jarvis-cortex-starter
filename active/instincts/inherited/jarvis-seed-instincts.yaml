# Pipeline Vendor -> Staging -> Active

## Acao
Sempre seguir o fluxo: vendor (copia fiel) -> staging (adaptacao) -> active (promocao apos revisao). Nunca pular etapas.

## Evidencia
- Aplicado com sucesso em verification-loop, strategic-compact, orchestrate, contexts, rules
- Cada etapa tem registro no ecc-adaptation-log.md

