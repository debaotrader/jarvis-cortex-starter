# Catalogos Estaticos Ficam Desatualizados

## Acao
Nao manter listas estaticas de skills no CLAUDE.md ou BOOT.md. Preferir descoberta via filesystem ou tabelas de ponteiros para modulos.

## Evidencia
- CLAUDE.md original tinha catalogo de skills que ficou desatualizado
- BOOT.md tinha lista de skills que nao refletia as promovidas do ECC
- Resolvido na modularizacao: removido catalogo, adicionado tabela de ponteiros
