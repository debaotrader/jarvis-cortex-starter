# Nao Importar Infra Pesada do ECC

## Acao
Importar apenas a camada de valor (skills markdown, conceitos, formatos). Pular infra pesada (tmux, worktree orchestrator, session adapters, background agents).

## Evidencia
- Orchestrate: importamos apenas o command, descartamos tmux/worktree/session layers
- Strategic-compact: importamos skill + hooks minimos, descartamos hook runner integral
- Instinct system: importamos modelo + Stop hook, descartamos observer agent background

